name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm run check:public
      - run: npm ci
      - run: npm run check
      - run: npm run demo
      - run: npm run demo:soak
      - run: npm run scenario -- --fixture --scenario shared-decision.json
      - run: npm run scenario -- --fixture --scenario pump-crisis.json
      - run: npm run scenario -- --fixture --scenario orbital-greenhouse.json
      - run: npm run check:runs
      - run: npm run check:consumer
      - run: npm pack --dry-run

  python-reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r examples/python-reader/requirements.txt
      - run: python -m unittest discover -s examples/python-reader -v
